name: Checks / Проверки
on:
  push:
  pull_request:
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 server/test_relay.py
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator app without local credentials
        run: xcodebuild -project iOS/StupidChat.xcodeproj -scheme StupidChat -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
