services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      - TIHO_ACCESS_KEY=${TIHO_ACCESS_KEY:?Set the same access key as Deployment.swift}
    volumes:
      - relay-data:/data
    expose:
      - '8787'
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - TIHO_DOMAIN=${TIHO_DOMAIN:?Set TIHO_DOMAIN to your server domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
volumes:
  relay-data:
  caddy-data:
  caddy-config:
