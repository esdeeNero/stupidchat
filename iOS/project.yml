name: StupidChat
options:
  bundleIdPrefix: app.tiho
  deploymentTarget:
    iOS: '17.0'
targets:
  StupidChat:
    type: application
    platform: iOS
    sources:
      - path: Tiho
        excludes: [Connection.local.plist]
    postBuildScripts:
      - name: Copy private local connection settings when present
        script: |
          target="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Connection.local.plist"
          if [ -f "$SRCROOT/Tiho/Connection.local.plist" ]; then
            cp "$SRCROOT/Tiho/Connection.local.plist" "$target"
          else
            rm -f "$target"
          fi
        basedOnDependencyAnalysis: false
    info:
      path: Tiho/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tiho.privatechat
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: stupidchat
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Запись голосовых сообщений
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Подключение к вашему серверу переписки
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  StupidChatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TihoTests]
    dependencies:
      - target: StupidChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
  StupidChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StupidChatUITests]
    dependencies:
      - target: StupidChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
